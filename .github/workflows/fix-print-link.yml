name: Connect Ringkas Print
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-print:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sambungkan tombol cetak ke laporan ringkas
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='onclick="printResults()"'
          new='onclick="openPrintPage()"'
          if old in s:
              s=s.replace(old,new,1)
          if 'function openPrintPage()' not in s:
              fn="function openPrintPage(){let code=document.getElementById('rcode')?.value.trim()||'';let pin=document.getElementById('rpin')?.value.trim()||'';if(!code||!pin){alert('Masukkan Kode Sesi dan PIN Guru BK terlebih dahulu.');return}let u='cetak-hasil.html?code='+encodeURIComponent(code)+'&pin='+encodeURIComponent(pin);let w=window.open(u,'_blank');if(!w)alert('Izinkan pop-up agar laporan dapat dibuka.')}"
              s=s.replace('</script>',fn+'\n</script>',1)
          p.write_text(s,encoding='utf-8')

          p=Path('cetak-hasil.html')
          s=p.read_text(encoding='utf-8')
          marker="async function loadResults()"
          if "URLSearchParams" not in s:
              inject="const params=new URLSearchParams(location.search);window.addEventListener('DOMContentLoaded',()=>{let c=params.get('code'),p=params.get('pin');if(c){document.getElementById('code').value=c}if(p){document.getElementById('pin').value=p}if(c&&p)loadResults()});"
              s=s.replace(marker,inject+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Simpan perubahan
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html cetak-hasil.html
          git diff --cached --quiet || git commit -m 'Sambungkan tombol hasil ke laporan ringkas'
          git push
