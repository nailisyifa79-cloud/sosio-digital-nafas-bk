name: One-time print fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix print layout') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch printResults
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='function printResults(){'
          i=s.find(marker)
          if i<0:
              raise SystemExit('printResults not found')
          depth=0; j=i; state='code'; quote=''; esc=False
          while j < len(s):
              c=s[j]
              n=s[j+1] if j+1<len(s) else ''
              if state=='code':
                  if c=='/' and n=='/': state='line'; j+=2; continue
                  if c=='/' and n=='*': state='block'; j+=2; continue
                  if c in "'\"`": state='str'; quote=c; j+=1; continue
                  if c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0:
                          j+=1; break
              elif state=='line':
                  if c=='\n': state='code'
              elif state=='block':
                  if c=='*' and n=='/': state='code'; j+=2; continue
              elif state=='str':
                  if esc: esc=False
                  elif c=='\\': esc=True
                  elif c==quote: state='code'
              j+=1
          new=r'''function printResults(){
            const source=document.getElementById('res');
            if(!source || !source.innerHTML.trim()){alert('Silakan klik "Buka Hasil" terlebih dahulu.');return;}
            const w=window.open('','_blank','width=950,height=750');
            if(!w){alert('Jendela cetak diblokir browser. Izinkan pop-up untuk situs ini.');return;}
            const cls=(document.getElementById('rcode')?.value||'').trim();
            w.document.write(`<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hasil Sosiometri ${cls}</title><style>
              *{box-sizing:border-box}body{margin:0;background:#fff;color:#17324d;font-family:Arial,sans-serif;font-size:12px}.toolbar{position:sticky;top:0;background:#fff;padding:12px;text-align:center;border-bottom:1px solid #d8e2ec;z-index:5}.toolbar button{border:0;border-radius:9px;padding:10px 18px;background:#f4b400;color:#17324d;font-weight:800;cursor:pointer}.sheet{max-width:900px;margin:0 auto;padding:12px}.sheet h1{font-size:20px;text-align:center;margin:4px 0}.sheet h2{font-size:14px;margin:8px 0}.sheet h3{font-size:12px;margin:6px 0}.sheet .panel,.sheet .aspect,.sheet .reason{border:1px solid #d8e2ec;border-radius:8px;padding:8px;margin:6px 0;box-shadow:none}.sheet .big{font-size:18px}.sheet .rank{padding:4px 0}.sheet .bar{height:6px}.sheet .fill{height:6px}.sheet .notice,.sheet .ok,.sheet .private{padding:7px;margin:5px 0}.sheet .actions{display:none!important}.sheet input,.sheet select,.sheet textarea{font-size:11px;padding:5px}.sheet .small{font-size:9px}@page{size:A4;margin:7mm}@media print{.toolbar{display:none}.sheet{max-width:none;padding:0}.sheet .panel,.sheet .aspect,.sheet .reason{break-inside:avoid;page-break-inside:avoid}}
            </style></head><body><div class="toolbar"><button onclick="window.print()">🖨️ CETAK / SIMPAN PDF</button></div><main class="sheet">${source.innerHTML}</main></body></html>`);
            w.document.close();
          }'''
          p.write_text(s[:i]+new+s[j:],encoding='utf-8')
          print('patched')
          PY
      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/one-time-print-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/one-time-print-fix.yml
          git commit -m "fix print layout" || exit 0
          git push
