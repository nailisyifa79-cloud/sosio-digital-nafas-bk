<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cetak Hasil Sosiometri - NaFaS BK</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f8fc;color:#17324d}.wrap{max-width:900px;margin:auto;padding:22px 14px}.card{background:#fff;border:1px solid #d8e3ed;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 4px 16px #123a6f12}h1{margin:0;color:#123a6f;font-size:24px}h2{margin:5px 0 18px;font-size:17px}label{display:block;font-weight:800;margin:10px 0 5px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #c9d8e6;border-radius:9px;font-size:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{border:0;border-radius:10px;padding:12px 17px;font-weight:800;cursor:pointer;margin-top:14px}.open{background:#123a6f;color:#fff}.print{background:#f4b400;color:#17324d}.back{background:#eaf4ff;color:#123a6f}.ok{background:#eaf8f2;border:1px solid #9dd9c4;padding:12px;border-radius:10px;margin-top:14px}.notice{background:#fff8df;border:1px solid #efd36a;padding:12px;border-radius:10px;margin-top:14px}.panel{border:1px solid #cfdbe7;border-radius:10px;padding:10px 12px;margin:10px 0;page-break-inside:avoid}.rank{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #e4edf4}.rank .name{flex:1;font-weight:700}.bar{height:8px;background:#e5edf4;border-radius:8px;margin-top:4px}.fill{height:8px;background:#123a6f;border-radius:8px}.reason{padding:7px 0;border-bottom:1px solid #e4edf4;font-size:13px}.small{font-size:12px;color:#667788}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}}@media print{body{background:#fff}.form,.toolbar,.topnotice{display:none!important}.wrap{max-width:none;padding:0}.card{border:0;box-shadow:none;padding:0}.panel{border:1px solid #cfdbe7}.reporthead{text-align:center}.private{font-size:10px;border-top:1px solid #ddd;padding-top:8px;margin-top:12px}}.reporthead{text-align:center;border-bottom:2px solid #123a6f;padding-bottom:10px;margin-bottom:12px}.private{font-size:11px;text-align:center;color:#667788}</style></head><body><div class="wrap"><div class="card form"><h1>🌟 SOSIO DIGITAL NaFaS BK</h1><h2>Cetak Hasil Sosiometri</h2><div class="notice topnotice">Masukkan <b>Kode Sesi</b> dan <b>PIN Guru BK</b>. Data hasil hanya ditampilkan setelah PIN benar.</div><div class="grid"><div><label>Kode Sesi</label><input id="code" placeholder="Contoh: SDBK-XXXX"></div><div><label>PIN Guru BK</label><input id="pin" placeholder="PIN Guru BK" type="password"></div></div><div class="toolbar"><button class="open" onclick="loadResults()">🔐 Buka Hasil</button><button class="back" onclick="history.back()">↩ Kembali</button></div><div id="msg"></div></div><div id="report"></div></div><script>const SERVER_URL='https://script.google.com/macros/s/AKfycbwawXgXFSwSO7Kj9J35xF7ewGJchGO4TeqL6OuJreGPX2p_Q1klsvvGHx_DQnD0sMfT/exec';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(action,data){let r=await fetch(SERVER_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action},data||{}))});return await r.json()}function msg(t,ok=false){document.getElementById('msg').innerHTML='<div class="'+(ok?'ok':'notice')+'">'+t+'</div>'}async function loadResults(){let code=document.getElementById('code').value.trim(),pin=document.getElementById('pin').value.trim();if(!code||!pin){msg('Masukkan kode sesi dan PIN Guru BK.');return}msg('⏳ Membuka hasil...');let r=await api('getResults',{code,pin});if(r.status!=='OK'){msg('❌ '+esc(r.message));document.getElementById('report').innerHTML='';return}let rs=r.responses||[],st=r.session.students,c={heart:{},coop:{},lead:{},uncomfortable:{}};st.forEach(s=>['heart','coop','lead','uncomfortable'].forEach(k=>c[k][s.id]=0));rs.forEach(x=>['heart','coop','lead','uncomfortable'].forEach(k=>(x[k]||[]).forEach(id=>c[k][id]++)));let name=id=>(st.find(s=>String(s.id)===String(id))||{name:id}).name;function sec(t,ic,k){let a=st.map(s=>({name:s.name,n:c[k][s.id]})).sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name,'id'));let max=Math.max(1,...a.map(x=>x.n));return '<div class="panel"><h3>'+ic+' '+t+'</h3>'+a.map((x,i)=>'<div class="rank"><div class="name">'+(i+1)+'. '+esc(x.name)+'<div class="bar"><div class="fill" style="width:'+Math.round(x.n/max*100)+'%"></div></div></div><b>'+x.n+' siswa</b></div>').join('')+'</div>'}function reasons(t,ic,k,rk){let z=[];rs.forEach(x=>(x[k]||[]).forEach((id,i)=>z.push('<div class="reason"><b>'+esc(name(id))+'</b><div class="small">Dipilih oleh: '+esc(x.respondentName)+'</div><div>'+esc((x[rk]||[])[i]||'-')+'</div></div>')));return '<div class="panel"><h3>'+ic+' '+t+'</h3>'+(z.length?z.join(''):'<div class="small">Belum ada alasan.</div>')+'</div>'}document.getElementById('report').innerHTML='<div class="card"><div class="reporthead"><h1>SOSIO DIGITAL NaFaS BK</h1><h2>HASIL SOSIOMETRI</h2><div class="small">Kode Sesi: <b>'+esc(code)+'</b> &nbsp; | &nbsp; Kelas: <b>'+esc(r.session.className||'')+'</b></div></div><div class="ok">'+rs.length+' dari '+st.length+' siswa sudah mengisi.</div>'+sec('Pertemanan','❤️','heart')+sec('Kerja Sama','🤝','coop')+sec('Kepemimpinan','⭐','lead')+sec('Relasi Kurang Nyaman','🔎','uncomfortable')+reasons('Alasan Pertemanan','❤️','heart','heartReason')+reasons('Alasan Kerja Sama','🤝','coop','coopReason')+reasons('Alasan Kepemimpinan','⭐','lead','leadReason')+reasons('Alasan Relasi Kurang Nyaman','🔎','uncomfortable','uncomfortableReason')+'<div class="private">🔐 Khusus Guru BK • Gunakan data secara bijak dan jangan membagikan jawaban individual kepada siswa lain.</div><div class="toolbar"><button class="print" onclick="window.print()">🖨️ CETAK / SIMPAN PDF</button></div></div>';msg('✅ Hasil berhasil dibuka. Silakan gunakan tombol kuning di bawah laporan untuk mencetak atau menyimpan PDF.','ok')}</script></body></html>
