#d2dee8;padding:5px;text-align:left;vertical-align:top}.reason-table th{background:#f2f7fb;color:#123a6f}.private{font-size:10px;text-align:center;color:#667788;border-top:1px solid #ddd;padding-top:8px;margin-top:12px}.print-help{background:#eef7ff;border:1px solid #c9dced;border-radius:10px;padding:10px;font-size:11px;margin:10px 0}.no-print{}.report-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:15px}.report-actions button{border:0;border-radius:10px;padding:12px 18px;font-weight:900;cursor:pointer}.report-actions .print{font-size:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}.result-table{font-size:10px}.result-table th,.result-table td{padding:5px 3px}.reason-table{font-size:9px}}@media print{body{background:#fff!important}.wrap{max-width:none;padding:0}.form,.screen-help,.no-print{display:none!important}.card{border:0;box-shadow:none;padding:0;margin:0 0 8px}.reporthead{padding-bottom:6px;margin-bottom:7px}.reporthead h1{font-size:18px}.reporthead h2{font-size:13px}.summary{font-size:10px;margin:5px 0 7px}.result-table{font-size:9px}.result-table th,.result-table td{padding:4px}.section-title{font-size:12px;margin:9px 0 4px}.reason-table{font-size:8px}.reason-table th,.reason-table td{padding:3px}.private{font-size:8px;margin-top:7px;padding-top:5px}@page{size:A4 portrait;margin:7mm}}</style></head><body><div class="wrap"><div class="card form"><h1>🌟 SOSIO DIGITAL NaFaS BK</h1><h2>Cetak Hasil Sosiometri</h2><div class="notice screen-help">Masukkan <b>Kode Sesi</b> dan <b>PIN Guru BK</b>, lalu klik <b>🔐 Buka Hasil</b>. Setelah hasil muncul, gunakan tombol <b>🖨️ CETAK / SIMPAN PDF</b> yang jelas di bawah laporan.</div><div class="grid"><div><label>Kode Sesi</label><input id="code" placeholder="Contoh: SDBK-XXXX"></div><div><label>PIN Guru BK</label><input id="pin" placeholder="PIN Guru BK" type="password"></div></div><div class="toolbar"><button class="open" onclick="loadResults()">🔐 Buka Hasil</button><button class="back" onclick="history.back()">↩ Kembali</button></div><div id="msg"></div></div><div id="report"></div></div><script>const SERVER_URL='https://script.google.com/macros/s/AKfycbwawXgXFSwSO7Kj9J35xF7ewGJchGO4TeqL6OuJreGPX2p_Q1klsvvGHx_DQnD0sMfT/exec';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(action,data){let r=await fetch(SERVER_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action},data||{}))});return await r.json()}function msg(t,ok=false){document.getElementById('msg').innerHTML='<div class="'+(ok?'ok':'notice')+'">'+t+'</div>'}function printReport(){window.print()}async function loadResults(){let code=document.getElementById('code').value.trim(),pin=document.getElementById('pin').value.trim();if(!code||!pin){msg('Masukkan kode sesi dan PIN Guru BK.');return}msg('⏳ Membuka hasil...');let r=await api('getResults',{code,pin});if(r.status!=='OK'){msg('❌ '+esc(r.message));document.getElementById('report').innerHTML='';return}let rs=r.responses||[],st=r.session.students,c={heart:{},coop:{},lead:{},uncomfortable:{}};st.forEach(s=>['heart','coop','lead','uncomfortable'].forEach(k=>c[k][s.id]=0));rs.forEach(x=>['heart','coop','lead','uncomfortable'].forEach(k=>(x[k]||[]).forEach(id=>c[k][id]++)));let name=id=>(st.find(s=>String(s.id)===String(id))||{name:id}).name;function rows(){let a=st.map(s=>({name:s.name,heart:c.heart[s.id]||0,coop:c.coop[s.id]||0,lead:c.lead[s.id]||0,uncomfortable:c.uncomfortable[s.id]||0,total:(c.heart[s.id]||0)+(c.coop[s.id]||0)+(c.lead[s.id]||0)+(c.uncomfortable[s.id]||0)}));return a.sort((x,y)=>x.name.localeCompare(y.name,'id')).map((x,i)=>'<tr><td>'+esc(x.name)+'</td><td>'+x.heart+'</td><td>'+x.coop+'</td><td>'+x.lead+'</td><td>'+x.uncomfortable+'</td><td><b>'+x.total+'</b></td></tr>').join('')}function reasons(t,ic,k,rk){let z=[];rs.forEach(x=>(x[k]||[]).forEach((id,i)=>z.push('<tr><td>'+esc(name(id))+'</td><td>'+esc(x.respondentName||'-')+'</td><td>'+esc((x[rk]||[])[i]||'-')+'</td></tr>')));return '<div class="section-title">'+ic+' '+t+'</div><table class="reason-table"><thead><tr><th>Siswa</th><th>Dipilih oleh</th><th>Alasan</th></tr></thead><tbody>'+(z.length?z.join(''):'<tr><td colspan="3">Belum ada alasan.</td></tr>')+'</tbody></table>'}document.getElementById('report').innerHTML='<div class="card"><div class="reporthead"><h1>SOSIO DIGITAL NaFaS BK</h1><h2>HASIL SOSIOMETRI</h2><div class="small">Kode Sesi: <b>'+esc(code)+'</b> &nbsp; | &nbsp; Kelas: <b>'+esc(r.session.className||'')+'</b> &nbsp; | &nbsp; Tahun: <b>'+esc(r.session.year||'')+'</b></div></div><div class="ok summary">'+rs.length+' dari '+st.length+' siswa sudah mengisi.</div><div class="print-help no-print">💡 <b>Untuk menyimpan:</b> klik <b>🖨️ CETAK / SIMPAN PDF</b>, lalu pada jendela cetak pilih tujuan <b>Save as PDF / Simpan sebagai PDF</b>.</div><div class="section-title">📊 Ringkasan Hasil per Siswa</div><div class="table-wrap"><table class="result-table"><thead><tr><th>Nama Siswa</th><th>❤️<br>Pertemanan</th><th>🤝<br>Kerja Sama</th><th>⭐<br>Kepemimpinan</th><th>🔎<br>Relasi Kurang Nyaman</th><th>Total</th></tr></thead><tbody>'+rows()+'</tbody></table></div>'+reasons('Alasan Pertemanan','❤️','heart','heartReason')+reasons('Alasan Kerja Sama','🤝','coop','coopReason')+reasons('Alasan Kepemimpinan','⭐','lead','leadReason')+reasons('Alasan Relasi Kurang Nyaman','🔎','uncomfortable','uncomfortableReason')+'<div class="private">🔐 Khusus Guru BK • Gunakan data secara bijak dan jangan membagikan jawaban individual kepada siswa lain.</div><div class="report-actions no-print"><button class="print" onclick="printReport()">🖨️ CETAK / SIMPAN PDF</button></div></div>';msg('✅ Hasil berhasil dibuka. Laporan sudah dibuat lebih ringkas dalam bentuk kolom agar lebih hemat kertas.','ok')}</script></body></html>
